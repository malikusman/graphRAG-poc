[tool.poetry]
name = "graphrag-poc"
version = "0.1.0"
description = "GraphRAG Proof of Concept - Graph-based Retrieval-Augmented Generation for scientific papers"
authors = ["SageWrite Team <team@sagewrite.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
langchain = "^0.3.20"
langchain-community = "^0.3.20"
langgraph = "^0.3.5"
celery = "^5.3.4"
pymongo = "^4.6.0"
motor = "^3.3.0"
redis = "^5.0.0"
openai = "^1.54.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.0.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
pymupdf = "^1.23.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
httpx = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.12.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.7.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true