version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: sagewrite-mongodb
    restart: "no"
    ports:
      - "27017:27017"
    networks:
      - sagewrite-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: sagewrite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sagewrite-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend Application
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sagewrite-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/sagewrite
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    # volumes:
      # - ./app:/app
      # - /app/__pycache__
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sagewrite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sagewrite-celery-worker
    restart: unless-stopped
    command: poetry run celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/sagewrite
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    # volumes:
      # - ./app:/app
      # - /app/__pycache__
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sagewrite-network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: sagewrite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - sagewrite-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  sagewrite-network:
    driver: bridge